# Gera o site estático a cada envio para `main` e grava o resultado (pasta out/)
# no ramo `publicado`. A Hostinger acompanha esse ramo e publica sozinha, como
# site estático, sem rodar Node.js no servidor.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Aumenta o limite da API do GitHub usada para estrelas e datas dos subapps.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gravar o site pronto no ramo publicado
        run: |
          cd out
          touch .nojekyll
          git init -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site gerado a partir de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" publicado
